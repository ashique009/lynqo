services:
  - type: web
    name: lynqo-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: ./render-build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://lynqoweb.website,https://www.lynqoweb.website,https://lynqoweb.vercel.app
      - key: FRONTEND_URL
        value: https://lynqoweb.website
